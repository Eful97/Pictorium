name: Update visual snapshots

# Rigenera i baseline screenshot della suite visuale SU LINUX e li committa sul
# branch indicato. Gli snapshot Playwright sono per-OS: questo workflow produce
# SOLO la variante Linux (quella usata dal job `visual` di ci.yml). Il branch di
# destinazione e' tipicamente il branch di una PR: il diff della PR e' la
# superficie di review (niente snapshot aggiornati alla cieca, vanno ispezionati
# come qualsiasi altra modifica).
#
# Nota: un push fatto con GITHUB_TOKEN NON triggera altri workflow (limite di
# GitHub per evitare loop). Dopo l'update il branch va quindi ri-controllato a
# mano — possibile proprio grazie al workflow_dispatch aggiunto a ci.yml.
#
# Permessi: la generazione (npm ci + Playwright sulle dipendenze del branch)
# gira con SOLO `contents: read`; il token scrivibile esiste soltanto nel job
# `commit-snapshots`, che non esegue codice del branch (checkout + artifact +
# git commit/push). La generazione passa i file modificati come artifact.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch da aggiornare (riceve commit + push degli snapshot)"
        required: true
        type: string
      grep:
        description: "Filtro opzionale --grep (es. 'badge')"
        required: false
        type: string

# Default read-only per l'intero workflow; nessun job eredita scritture.
permissions:
  contents: read

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.branch }}
          # Serve la history solo al job di commit; qui nessun push.
          fetch-depth: 0
          # Questo job non scrive sul repository: nessuna credenziale
          # persistita in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Il filtro arriva via env: mai interpolato nella stringa di shell.
      - name: Update snapshot baselines
        env:
          GREP_FILTER: ${{ inputs.grep }}
        run: |
          if [ -n "$GREP_FILTER" ]; then
            npx playwright test e2e/pictorium-visual.spec.ts --update-snapshots --grep "$GREP_FILTER"
          else
            npx playwright test e2e/pictorium-visual.spec.ts --update-snapshots
          fi

      # Stessa semantica dello storico `git status --porcelain -- e2e/` del
      # passo di commit: nessuna modifica = nessun artifact e nessun job di
      # push (workflow comunque verde).
      - name: Detect snapshot changes
        id: detect
        run: |
          if [ -z "$(git status --porcelain -- e2e/)" ]; then
            echo "no snapshot changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git status --porcelain -- e2e/
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Solo i file sotto e2e/ possono cambiare; l'artifact trasporta la loro
      # versione generata al job che ha il permesso di scrittura.
      - name: Upload updated snapshots
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updated-snapshots
          path: e2e/
          retention-days: 1
          if-no-files-found: error

      - name: Job summary
        if: always()
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          {
            echo "### Snapshot Linux aggiornati"
            echo ""
            echo "Branch: \`${TARGET_BRANCH}\`"
            echo ""
            echo "**Il push fatto con \`GITHUB_TOKEN\` non triggera la CI.**"
            echo "Il branch va ri-controllato a mano con:"
            echo ""
            echo '```'
            echo "gh workflow run ci.yml --ref ${TARGET_BRANCH}"
            echo '```'
            echo ""
            echo "Poi revisiona il diff degli snapshot nella PR prima del merge."
          } >> "$GITHUB_STEP_SUMMARY"

  # UNICO job con `contents: write`. Non esegue nulla del branch: applica gli
  # snapshot generati (artifact) sul checkout e pusha, senza force.
  commit-snapshots:
    needs: update-snapshots
    if: needs.update-snapshots.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.branch }}
          # Serve la history per committare/pushare sul branch indicato.
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: updated-snapshots
          path: e2e/
      - name: Commit and push updated snapshots
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          if [ -z "$(git status --porcelain -- e2e/)" ]; then
            echo "no snapshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/
          git commit -m "test(visual): Update Linux snapshot baselines"
          # Mai force-push: un push normale fallisce se il branch e' avanzato.
          git push origin "HEAD:${TARGET_BRANCH}"
