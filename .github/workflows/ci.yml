name: CI

on:
  push:
    branches: [master, main]
    # Docs-only master pushes skip the whole suite (docker.yml's workflow_run
    # consequently does not fire: no image rebuild for a README edit).
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    # `ready_for_review` e' NECESSARIO: i tipi di default sono solo
    # opened/synchronize/reopened, quindi segnare una draft PR come "ready"
    # non farebbe partire il run completo (resterebbe senza verify/visual).
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Un push su master NON deve mai cancellare il proprio run: docker.yml consuma
# la conclusion via workflow_run, e un run cancellato non publica l'immagine.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Feedback loop veloce (~2-3 min) su OGNI evento, draft inclusi: typecheck +
  # lint. Il resto delle verifiche pesanti vive in verify/visual.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 22: jsdom 30 (devDep) richiede ^22.22.2 || ^24.15.0 || >=26 —
          # su Node 20 i worker vitest crashano (undici 8: markAsUncloneable).
          # Il runtime di produzione non usa jsdom (devDependency only).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      # Fase 5 guardrails: dead code / unused deps (knip) and architectural
      # dependency boundaries (dependency-cruiser: @resvg/resvg-js only from
      # src/lib/svg-badge.ts, no server-only runtimes in components, no
      # src/lib <-> src/app cycles).
      #
      # WARN-ONLY on purpose: the first baseline is non-empty (pre-existing
      # dead exports/dead files) and must not block unrelated WIP. Both tools
      # exit non-zero on findings (dependency-cruiser only for error-severity
      # rules, which is every rule in the config), so making them blocking =
      # delete the two `continue-on-error` lines below once the baseline is
      # triaged.
      - name: Dead code and unused dependencies (knip, warn-only)
        continue-on-error: true
        run: npx knip --no-progress
      - name: Dependency boundaries (dependency-cruiser, warn-only)
        continue-on-error: true
        run: npx depcruise src --output-type err

  # Decide se la suite pesante ha qualcosa da verificare. Un `paths-ignore` a
  # livello workflow lascerebbe i check richiesti verify/visual PENDING per
  # sempre sulle PR docs-only (merge bloccato), quindi la decisione vive in un
  # job che gira sempre e che i gate pesanti consumano.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The base-branch comparison needs the history, not a depth-1 clone.
          fetch-depth: 0
      - id: filter
        name: Detect docs-only change sets
        shell: bash
        run: |
          set -euo pipefail
          # Default ON: anything we cannot prove docs-only keeps the heavy work.
          code=true
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.base_ref }}"
            # Fetch the base branch explicitly: the PR checkout may not have it.
            git fetch --no-tags origin "+refs/heads/${base}:refs/remotes/origin/${base}"
            changed="$(git diff --name-only "origin/${base}...HEAD")"
            if [[ -n "$changed" ]]; then
              # Start from "docs-only" and flip on the first non-doc path.
              code=false
              shopt -s nocasematch
              while IFS= read -r path; do
                # `case` globs: `*` spans `/`, so `docs/*` covers nested files.
                case "$path" in
                  *.md|docs/*|LICENSE) ;;
                  *) code=true; break ;;
                esac
              done <<< "$changed"
            fi
          fi
          # Never emit an empty output; a git/metadata error above fails the step.
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Suite pesante: parte solo quando i controlli veloci sono verdi e la PR non
  # e' una draft (git push su master/main gira sempre). Un change set docs-only
  # salta il lavoro pesante ma il job resta SUCCESS (check richiesto verde).
  # `always()` e' obbligatorio: senza, un `fast` fallito SALTA verify, e su
  # GitHub uno status check richiesto "skipped" conta come accettabile ->
  # merge consentito. Con `always()` + guardia un `fast` rosso produce un verify
  # FAILED; le draft PR continuano a saltare la suite pesante.
  verify:
    needs: [fast, changes]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    # Shard the Vitest suite across 3 parallel runners to cut wall time (~1/3).
    # Coverage stays OFF in shards (use `npm run test:coverage` in a dedicated
    # job if needed); merging per-shard coverage is out of scope here.
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      # A failed OR skipped changes job must fail this gate, never skip it.
      - name: Fast checks and change detection must be green
        if: needs.fast.result != 'success' || needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.code == 'true'
      - run: npx vitest run --shard=${{ matrix.shard }}
        if: needs.changes.outputs.code == 'true'
      - run: npm run build
        if: needs.changes.outputs.code == 'true' && matrix.shard == '1/3'

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Subject check needs history (default depth 1 has no ranges).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-commit-subjects.mjs

  visual:
    needs: changes
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Changed files must be readable
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.code == 'true'
      - run: npx playwright install --with-deps chromium
        if: needs.changes.outputs.code == 'true'
      - run: npx playwright test e2e/pictorium-visual.spec.ts
        if: needs.changes.outputs.code == 'true'
      # Su failure carica i render actual: servono per creare la variante
      # snapshot della piattaforma CI (gli snapshot sono per-OS) dopo revisione.
      - uses: actions/upload-artifact@v4
        if: failure() && needs.changes.outputs.code == 'true'
        with:
          name: visual-test-results
          path: test-results/
          retention-days: 7
