name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 22: jsdom 30 (devDep) richiede ^22.22.2 || ^24.15.0 || >=26 —
          # su Node 20 i worker vitest crashano (undici 8: markAsUncloneable).
          # Il runtime di produzione non usa jsdom (devDependency only).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run test

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/posterium-visual.spec.ts
      # Su failure carica i render actual: servono per creare la variante
      # snapshot della piattaforma CI (gli snapshot sono per-OS) dopo revisione.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-test-results
          path: test-results/
          retention-days: 7
