name: CI

on:
  push:
    branches: [master, main]
    # Docs-only master pushes skip the whole suite (docker.yml's workflow_run
    # consequently does not fire: no image rebuild for a README edit).
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    # `ready_for_review` e' NECESSARIO: i tipi di default sono solo
    # opened/synchronize/reopened, quindi segnare una draft PR come "ready"
    # non farebbe partire il run completo (resterebbe senza verify/visual).
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Un push su master NON deve mai cancellare il proprio run: docker.yml consuma
# la conclusion via workflow_run, e un run cancellato non publica l'immagine.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Feedback loop veloce (~2-3 min) su OGNI evento, draft inclusi: typecheck +
  # lint. Il resto delle verifiche pesanti vive in verify/visual.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Node 22: jsdom 30 (devDep) richiede ^22.22.2 || ^24.15.0 || >=26 —
          # su Node 20 i worker vitest crashano (undici 8: markAsUncloneable).
          # Il runtime di produzione non usa jsdom (devDependency only).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # ESLint result cache: `--cache` only reuses findings for unchanged files,
      # it never turns a failing lint green. The key is the lint config plus the
      # dependency lockfile, so a rule or dependency change forces a cold run.
      - name: Restore ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'package-lock.json') }}
      - run: npx eslint . --cache
      # Fase 5 guardrails: dead code / unused deps (knip) and architectural
      # dependency boundaries (dependency-cruiser: @resvg/resvg-js only from
      # src/lib/svg-badge.ts, no server-only runtimes in components, no
      # src/lib <-> src/app cycles).
      #
      # WARN-ONLY on purpose: the first baseline is non-empty (pre-existing
      # dead exports/dead files) and must not block unrelated WIP. Both tools
      # exit non-zero on findings (dependency-cruiser only for error-severity
      # rules, which is every rule in the config), so making them blocking =
      # delete the two `continue-on-error` lines below once the baseline is
      # triaged.
      - name: Dead code and unused dependencies (knip, warn-only)
        continue-on-error: true
        run: npx knip --no-progress
      - name: Dependency boundaries (dependency-cruiser, warn-only)
        continue-on-error: true
        run: npx depcruise src --output-type err

  # Decide se la suite pesante ha qualcosa da verificare. Un `paths-ignore` a
  # livello workflow lascerebbe i check richiesti verify/visual PENDING per
  # sempre sulle PR docs-only (merge bloccato), quindi la decisione vive in un
  # job che gira sempre e che i gate pesanti consumano.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The base-branch comparison needs the history, not a depth-1 clone.
          fetch-depth: 0
      - id: filter
        name: Detect docs-only change sets
        shell: bash
        # Classification lives in a tested script (parity table in
        # src/__tests__/ci-changes-filter.test.ts); it still writes `code=` to
        # $GITHUB_OUTPUT and exits non-zero on git/metadata errors without
        # emitting an empty output.
        run: node scripts/ci-changes-filter.mjs

  # Suite pesante: parte in PARALLELO con `fast` (non lo aspetta) e solo quando
  # la PR non e' una draft (git push su master/main gira sempre). Un change set
  # docs-only salta il lavoro pesante ma il job resta SUCCESS (check richiesto
  # verde). `always()` e' obbligatorio: senza, un `changes` fallito SALTEREBBE
  # verify e su GitHub uno status check richiesto "skipped" conta come
  # accettabile -> merge consentito. Il guard su `fast` vive nell'aggregato
  # (verify-aggregate), che resta l'unico publisher del context `verify`.
  verify:
    needs: [changes]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    # Shard the Vitest suite across 3 parallel runners to cut wall time (~1/3).
    # KEEP IN SYNC with .github/workflows/release.yml `verify`: the tag runs the
    # SAME shards and the same `npm run build` (there it stays on shard 1/3;
    # here build is its own `build` job added to the aggregate — same command,
    # same Node, same `npm ci`). A green PR must predict a green tag — v1.27.2
    # went red on the tag only because the release ran the full suite unsharded.
    # Coverage stays OFF in shards (use `npm run test:coverage` in a dedicated
    # job if needed); merging per-shard coverage is out of scope here.
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      # A failed OR skipped changes job must fail this gate, never skip it.
      # (The `fast` guard lives in verify-aggregate: verify no longer waits on it.)
      - name: Change detection must be green
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.code == 'true'
      - run: npx vitest run --shard=${{ matrix.shard }}
        if: needs.changes.outputs.code == 'true'

  # Build in its own job instead of the serial tail of shard 1/3: it starts in
  # parallel with the shard matrix (needs only `changes`), and the aggregate
  # below still gates on it, so a red build still turns the required `verify`
  # context red. Same `npm ci` + `npm run build` as the tag pipeline.
  build:
    needs: [changes]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      # A failed OR skipped changes job must fail this gate, never skip it.
      - name: Change detection must be green
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.code == 'true'
      - run: npm run build
        if: needs.changes.outputs.code == 'true'

  # Aggregate gate published as the literal check `verify`. Branch protection
  # on master requires the contexts `commits`/`verify`/`visual`, but a sharded
  # matrix only reports `verify (1/3|2/3|3/3)`: the required `verify` check
  # never appeared, so a PR with every shard green stayed BLOCKED on a PENDING
  # required check. This job republishes that exact context and fails unless
  # the fast checks, the build AND the whole shard matrix succeeded (a skipped
  # shard is not a pass). `fast` is guarded HERE instead of inside verify so the
  # heavy shards start in parallel with it; a red fast step still turns the
  # required `verify` context red. Drafts skip this job via `if` (same as the
  # heavy jobs), so a skipped heavy job on a draft never fails the aggregate.
  verify-aggregate:
    name: verify
    needs: [fast, verify, build]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      # A failed fast check, build or shard matrix must fail this gate, never
      # skip it.
      - name: Fast checks, build and all verify shards must be green
        if: needs.fast.result != 'success' || needs.verify.result != 'success' || needs.build.result != 'success'
        run: exit 1

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Subject check needs history (default depth 1 has no ranges).
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: node scripts/check-commit-subjects.mjs

  visual:
    needs: changes
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Changed files must be readable
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.code == 'true'
      - run: npx playwright install --with-deps chromium
        if: needs.changes.outputs.code == 'true'
      # Parità preview-vs-Stremio (Golden Rule) + visual regression nello stesso
      # job: la parità non ha snapshot per-OS (confronta due render della stessa
      # build, bound sui pixel ~0) e condivide app+mock con il visual, quindi un
      # solo boot di `next dev` copre entrambi. Il check richiesto resta
      # `visual` (branch protection invariata): nessun job nuovo da aggiungere.
      #
      # NON eseguiti qui (fuori scope finché non esistono i baseline Linux):
      # `e2e/card-layout.spec.ts` (8 golden) e `e2e/colored-light-text.spec.ts`
      # (1 golden) spediscono SOLO la variante win32. Su ubuntu il baseline
      # `-chromium-linux` manca e Playwright fallisce con "snapshot doesn't
      # exist": aggiungerli senza baseline renderebbe il job rosso, e generarle
      # al volo sarebbe una baseline non revisionata. Follow-up (richiede il
      # workflow `Update visual snapshots`, oggi limitato a
      # pictorium-visual.spec.ts): generare e committare i 9 baseline Linux
      # revisionati. Comando esatto su Linux:
      #   npx playwright test e2e/card-layout.spec.ts e2e/colored-light-text.spec.ts --update-snapshots
      # poi estendere la riga sotto con i due spec.
      # KEEP IN SYNC with .github/workflows/release.yml `visual` (same command).
      - run: npx playwright test e2e/pictorium-visual.spec.ts e2e/pictorium-parity.spec.ts
        if: needs.changes.outputs.code == 'true'
      # Su failure carica i render actual: servono per creare la variante
      # snapshot della piattaforma CI (gli snapshot sono per-OS) dopo revisione.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && needs.changes.outputs.code == 'true'
        with:
          name: visual-test-results
          path: test-results/
          retention-days: 7
