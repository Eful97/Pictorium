name: Release

# Tag pushed (or manually dispatched) -> CI gates -> pretty GitHub Release with
# grouped, emoji changelog. The body renders the ONE approved source — the
# curated entry for the tag in src/data/changelog.ts (written at release time
# from reviewed editorial notes via write-changelog-release.mjs --notes) — never
# raw commit subjects. Raw subjects are only collected as review material
# (`write-changelog-release.mjs --collect`) and never published.
#
# Gates (verify/commits/visual) mirror .github/workflows/ci.yml and run on the
# TAG ref, not on master: a manual backfill of an old tag validates the code of
# that tag. Publishing never runs unless all three gates are green.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)publish, e.g. v1.24.0 (backfill included)"
        required: true

# Never cancel an in-flight publish: grouping is per tag/ref so two different
# releases still run independently, and a duplicate trigger for the SAME tag
# (re-push, or a backfill dispatch racing the tag push) queues instead of
# killing the run that is publishing the release. cancel-in-progress MUST stay
# false — a cancelled publish never reaches `gh release create/edit`.
concurrency:
  # `inputs.tag` (dispatch) and `ref_name` (tag push) both resolve to the bare
  # tag name, so a re-push and a backfill dispatch of the SAME tag share one
  # group and queue; different tags keep independent groups.
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # MUST stay gate-equivalent to ci.yml `fast` + `verify` + `build` (same
  # commands, same shards, same workers/timeouts; ci.yml splits `npm run build`
  # into its own job and adds only `eslint --cache`, a result-cache flag that
  # never changes findings): a green PR has to predict a green tag.
  # v1.27.2 regressed exactly here — this job ran the WHOLE Vitest suite on one
  # runner (`npm run test`) while the PR ran it sharded across 3 runners, so the
  # extra worker saturation pushed two timing-sensitive editor tests past their
  # budgets (personal-preset-independence-raw-import.test.tsx: 5s timeout;
  # settings-mobile-preview.test.tsx: zoom trigger not found). PR green, tag
  # red. The shards below are the PR's shards, unchanged.
  #
  # `publish` keeps `needs: [verify, commits, visual]` and GitHub waits for
  # EVERY matrix leg, so all three shards still gate publishing: no separate
  # aggregate alias job is needed here (the aggregate in ci.yml exists only to
  # republish the literal `verify` context that branch protection requires).
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@v7
        with:
          # Validate the tagged code (dispatch: the requested tag), not master.
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # Node 22: jsdom 30 (devDep) requires ^22.22.2 || ^24.15.0 || >=26.
          node-version: 22
          cache: npm
      - run: npm ci
      # Static gates on shard 1/3 only, mirroring ci.yml `fast` (one run, not
      # one per shard). They live here because `publish` must keep depending on
      # `verify` alone.
      - run: npx tsc --noEmit
        if: matrix.shard == '1/3'
      - run: npx eslint .
        if: matrix.shard == '1/3'
      - run: npx vitest run --shard=${{ matrix.shard }}
      - run: npm run build
        if: matrix.shard == '1/3'

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Subject check needs history (default depth 1 has no ranges).
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-commit-subjects.mjs

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Same command as ci.yml `visual`: visual regression PLUS the
      # preview-vs-Stremio parity suite (the tag must not run a weaker gate
      # than the PR that produced it; parity has no per-OS snapshots).
      - run: npx playwright test e2e/pictorium-visual.spec.ts e2e/pictorium-parity.spec.ts
      # On failure upload the actual renders: they are needed to create the CI
      # platform snapshot variant (snapshots are per-OS) after review.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-test-results
          path: test-results/
          retention-days: 7

  publish:
    needs: [verify, commits, visual]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Notes need the range since the previous tag (default depth 1
          # has no history, like the commits job in ci.yml).
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Build release notes
        id: notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Compare against the last PUBLISHED release, never the last tag: a
          # tag whose release failed (e.g. v1.26.5) must not become the base and
          # silently swallow a range users never saw. Only ancestors of TAG^ are
          # considered, so backfilling an old tag still resolves to its own
          # real predecessor.
          PREV=""
          while IFS= read -r candidate; do
            if [ -n "$candidate" ] && git merge-base --is-ancestor "${candidate}^{commit}" "${TAG}^" 2>/dev/null; then
              PREV="$candidate"
              break
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          fi
          if [ -z "$PREV" ]; then
            echo "no previous tag reachable from $TAG"
            exit 1
          fi
          node scripts/build-release-notes.mjs "$PREV" "$TAG" > /tmp/notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.notes.outputs.tag }}"
          # Idempotent: re-running a tag push (or backfilling) updates
          # the notes instead of failing on an existing release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Release ${TAG#v}" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --title "Release ${TAG#v}" --notes-file /tmp/notes.md
          fi
      - name: Announce to Discord
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ steps.notes.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/notify-discord-release.mjs /tmp/notes.md

