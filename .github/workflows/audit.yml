name: Dependency Audit

# Le CVE delle dipendenze (es. sharp/libvips, advisory Next) emergono di
# continuo: questo job le rende visibili settimanalmente anche senza push,
# fallendo su vulnerabilità high/critical in produzione.
on:
  schedule:
    - cron: "30 5 * * 1" # lunedì 05:30 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Allineato a ci.yml/load-smoke.yml (engines richiede >=22): questo job
          # non carica jsdom, ma la matrice dei workflow deve restare coerente.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail on high/critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high
