name: Sync with Upstream

on:
  schedule:
    - cron: '0 4 * * *' # Ogni giorno alle 04:00 UTC
  workflow_dispatch: # Permette l'aggiornamento manuale a 1 click dalla scheda Actions

jobs:
  sync:
    name: Sync with Upstream Pictorium
    runs-on: ubuntu-latest
    if: github.repository != 'Eful97/Pictorium'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Eful97/Pictorium.git || true
          git fetch upstream main
          git merge upstream/main --ff-only || git merge upstream/main -m "chore: sync with upstream Pictorium"
          git push origin main
