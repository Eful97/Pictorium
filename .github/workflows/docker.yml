name: Build and Publish Docker Image

on:
  # Branch pushes only VERIFY the build (push: false below): publishing is
  # green-gated via workflow_run (CI success), release (published) and the
  # tag dispatch fired by release.yml after its gates, so red CI can never
  # push images.
  push:
    branches: [master, main]
    # Version tags are BUILD-ONLY: the tag arrives before the Release pipeline
    # (verify/commits/visual gates in release.yml) has finished, so publishing
    # here would race those gates and could ship a release image for a red tag.
    # The semver image is published only by the already-verified paths
    # (workflow_run on CI success / release published). The trigger is kept so
    # the tagged commit still proves it builds, but push: false.
    tags: ['v*.*.*']
    # Docs-only master pushes need no image: skip the build entirely (CI itself
    # is skipped too, so the workflow_run publish path does not fire either).
    # Path filters are not evaluated for tag pushes, so releases are never
    # skipped by this rule.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  # PRs validate the image build only (push/latest gates below never match):
  # amd64-only and no registry login, so it stays cheap and cannot publish.
  pull_request:
    branches: [master]
    paths: ['Dockerfile', '.dockerignore', 'package.json', 'package-lock.json', 'next.config.*', 'scripts/**', '.github/workflows/docker.yml']
  # Publish happens on CI-verified master pushes, published releases and a
  # version-tag workflow_dispatch (release.yml, post-gates) only (a version
  # tag push is build-only and never logs in or pushes).
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  release:
    types: [published]
  workflow_dispatch:

# Default read-only per il workflow: nessun job eredita `packages: write`.
# Solo il job `docker` (login GHCR + push) riceve il permesso di scrittura;
# Docker Hub usa secret propri e non consuma GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  docker:
    name: Build & Push Multi-Arch Image
    permissions:
      contents: read
      packages: write
    # workflow_run fires for every CI conclusion: skip unless the triggering
    # run was a branch push that passed ALL gates (event == 'push' also keeps
    # PR-originated CI runs from ever publishing).
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run/release run on default-branch context (GITHUB_SHA =
          # default tip, NOT the tested commit): pin the gated ref explicitly.
          # A tag push already carries the tag in github.ref.
          ref: ${{ github.event.workflow_run.head_sha || github.event.release.tag_name || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Publish gate (identical for both logins and the push): only the two
      # already-verified paths may publish. A `push` event is build-only, and a
      # version tag push is deliberately NOT listed here — release.yml gates
      # (verify/commits/visual) run on the same tag, so publishing on the tag
      # would race them. latest/branch images come from workflow_run (CI
      # success); semver images come from the dispatch that release.yml
      # `publish` fires on the tag AFTER its gates are green (a
      # GITHUB_TOKEN-created release never triggers `release: published`, but
      # workflow_dispatch is exempt from that rule).
      - name: Log in to Docker Hub
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            eful97/pictorium
            eful97/posterium
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Generate recent-changes for the changelog modal
        # Il builder Docker non ha .git nel context: si genera qui (checkout
        # completo) così l'immagine incorpora i commit di questo push. Lo
        # script non sovrascrive mai senza git (fail-safe per altri builder).
        run: node scripts/write-recent-changes.mjs

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          # PR validation builds only the native arch; amd64+arm64 (QEMU) stay
          # on branch/release/tag builds (tag builds never push).
          platforms: linux/amd64${{ github.event_name != 'pull_request' && ',linux/arm64' || '' }}
          # Build-only unless the gate above matched: a version tag push builds
          # the tagged commit, it never publishes semver/latest/branch tags.
          push: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Versione vera dentro l'immagine: il generator la legge da APP_VERSION
          # perché il build context esclude .git. Su tag vX.Y.Z metadata-action
          # restituisce X.Y.Z; su push di branch/sha il valore non è semver e il
          # generator lo ignora (fallback alla versione base del package.json).
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
